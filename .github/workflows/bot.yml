name: trading-bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "TRADING_MODE override (bos birak = paper)"
        required: false
        default: ""
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  pull_request:

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  selftest:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py --selftest

  run-bot:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore state (data/) from state branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state
            git checkout origin/state -- data/trading.db 2>/dev/null || echo "state branch'te db yok - ilk calistirma"
          else
            echo "ilk calistirma - state branch yok"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot (bounded)
        env:
          TRADING_MODE: ${{ github.event.inputs.mode || vars.TRADING_MODE || 'paper' }}
          LIVE_ARM: ${{ vars.LIVE_ARM || 'no' }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH || 'no' }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET: ${{ secrets.MEXC_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_N_SYMBOLS: ${{ vars.TOP_N_SYMBOLS || '20' }}
          PRIMARY_TIMEFRAME: ${{ vars.PRIMARY_TIMEFRAME || '15m' }}
          HIGHER_TIMEFRAME: ${{ vars.HIGHER_TIMEFRAME || '4h' }}
          POLL_SECONDS: "60"
          MAX_RUNTIME_MINUTES: "28"
          DATA_DIR: data
        run: python main.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: data/system.log*
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist state to state branch
        if: always()
        run: |
          python - <<'EOF'
          import sqlite3, os
          p = "data/trading.db"
          if os.path.exists(p):
              c = sqlite3.connect(p)
              c.execute("PRAGMA wal_checkpoint(TRUNCATE);")
              c.close()
          EOF
          git config user.name "bot-state"
          git config user.email "bot-state@users.noreply.github.com"
          git checkout -B state
          git add -f data/trading.db 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "degisiklik yok"
          else
            git commit -m "state update [skip ci]"
            git push origin state --force
          fi
